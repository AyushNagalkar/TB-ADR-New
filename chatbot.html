<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Browser Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #response { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; min-height: 50px; }
    </style>
</head>
<body>

    <h2>Chat with Local LLM</h2>
    <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>
    <br>
    <button onclick="sendToLLM()">Send Request</button>

    <h3>Response:</h3>
    <div id="response">Your AI response will appear here...</div>

    <script>
        async function sendToLLM() {
            const promptValue = document.getElementById('promptInput').value;
            const responseDiv = document.getElementById('response');
            
            if (!promptValue) {
                alert("Please enter a prompt first!");
                return;
            }

            responseDiv.innerText = "Thinking...";

            try {
                const res = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama3.2:3b', // <-- Change this to your installed model name (e.g., 'mistral', 'phi3')
                        prompt: promptValue,
                        stream: false     // Keeps it simple by waiting for the full response
                    })
                });

                if (!res.ok) {
                    throw new Error(`Server returned status: ${res.status}`);
                }

                const data = await res.json();
                responseDiv.innerText = data.response;

            } catch (error) {
                responseDiv.innerText = "Error: " + error.message + "\n\nMake sure Ollama is running and OLLAMA_ORIGINS is configured properly.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
